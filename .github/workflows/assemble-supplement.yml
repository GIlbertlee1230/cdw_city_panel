name: Assemble supplementary archive
on:
  push:
    paths:
      - '.github/workflows/assemble-supplement.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat ICCBEI_Supplementary_Materials_20261110.zip.part001 ICCBEI_Supplementary_Materials_20261110.zip.part002 ICCBEI_Supplementary_Materials_20261110.zip.part003 ICCBEI_Supplementary_Materials_20261110.zip.part004 > ICCBEI_Supplementary_Materials_20261110.zip
          sha256sum --check ICCBEI_Supplementary_Materials_20261110.zip.sha256
          python3 -m zipfile --test ICCBEI_Supplementary_Materials_20261110.zip
          rm ICCBEI_Supplementary_Materials_20261110.zip.part001 ICCBEI_Supplementary_Materials_20261110.zip.part002 ICCBEI_Supplementary_Materials_20261110.zip.part003 ICCBEI_Supplementary_Materials_20261110.zip.part004
          rm .github/workflows/assemble-supplement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified three-part supplementary archive'
          git push
